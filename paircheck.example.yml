# The rules of paircheck in its own format, with every optional key of a rule
# written at its default, and `failures` at its own. `slot` is left out: by
# default it is deduced from the types, as the README describes under Rules,
# where every key is.
#
#   paircheck -c paircheck.example.yml ./...
failures: []
rules:
  - id: transaction
    trigger: (*database/sql.DB).Begin
    satisfiers:
      - (*database/sql.Tx).Commit
      - (*database/sql.Tx).Rollback
    open-on-error: false
    deferred-closure: any-path
    transfer: all
    require-defer: false
    idempotent: false
    defer-first: false
    on-success: false

  - id: file
    trigger: os.Open
    satisfiers:
      - (*os.File).Close
    open-on-error: false
    deferred-closure: any-path
    transfer: all
    require-defer: false
    idempotent: false
    defer-first: false
    on-success: false

  - id: lock
    trigger: (*sync.Mutex).Lock
    satisfiers:
      - (*sync.Mutex).Unlock
    open-on-error: false
    deferred-closure: any-path
    transfer: all
    require-defer: false
    idempotent: false
    defer-first: false
    on-success: false
