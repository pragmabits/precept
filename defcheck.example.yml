# The rules of defcheck in its own format, with every key of a rule written:
# `message` at its default in the second rule, where the diagnostic names the
# pattern and the kind. `kinds` left empty, or out, is every kind. The README
# describes every key under Rules.
#
#   defcheck -c defcheck.example.yml ./...
rules:
  - pattern: '^cfg$'
    kinds: [local-var, parameter, field]
    message: avoid the cfg abbreviation

  - pattern: '(?i)manager$'
    kinds: [package-var, field, function, method]
    message: ''
