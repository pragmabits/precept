# Every rule the project under testdata/project is checked against. The first
# three are the README's own; the project's `// want` comments say what each
# rule reports. The project's own packages are named relative to its module,
# but in pool, written in full, and in pool-strict, which mixes both.
failures:
  - ./ledger.Wrap

rules:
  - id: transaction
    trigger: (*database/sql.DB).Begin
    satisfiers:
      - (*database/sql.Tx).Commit
      - (*database/sql.Tx).Rollback
    transfer: {return: true, store: false, argument: false}

  - id: file
    trigger: os.Open
    satisfiers:
      - (*os.File).Close

  - id: lock
    trigger: (*sync.Mutex).Lock
    satisfiers:
      - (*sync.Mutex).Unlock

  - id: begintx
    trigger: (*database/sql.DB).BeginTx
    satisfiers:
      - (*database/sql.Tx).Commit
      - (*database/sql.Tx).Rollback

  - id: pool
    trigger: (*example.com/project/txn.Pool).Begin
    satisfiers:
      - (example.com/project/txn.Tx).Commit
      - (example.com/project/txn.Tx).Rollback
    transfer: {return: true, store: false, argument: false}

  - id: pool-strict
    trigger: (*./txn.Pool).Begin
    satisfiers:
      - (example.com/project/txn.Tx).Commit
      - (./txn.Tx).Rollback
    transfer: {return: true, store: false, argument: false}
    require-defer: true

  - id: conn
    trigger: (*./txn.Conn).Begin
    satisfiers:
      - (./txn.Tx).Commit
      - (./txn.Tx).Rollback
    transfer: {return: true, store: false, argument: false}

  - id: savepoint
    trigger:
      name: (./txn.Tx).Begin
      slot: result 0
    satisfiers:
      - (./txn.Tx).Commit
      - (./txn.Tx).Rollback
    transfer: {return: true, store: false, argument: false}

  - id: read
    trigger: (*sync.RWMutex).RLock
    satisfiers:
      - (*sync.RWMutex).RUnlock

  - id: read-strict
    trigger: (*sync.RWMutex).RLock
    satisfiers:
      - (*sync.RWMutex).RUnlock
    require-defer: true

  - id: lease
    trigger: ./lease.Acquire
    satisfiers:
      - (*./lease.Lease).Release
    open-on-error: true

  - id: lease-strict
    trigger: ./lease.Acquire
    satisfiers:
      - (*./lease.Lease).Release
    open-on-error: true
    require-defer: true

  - id: batch-any
    trigger: ./batch.Start
    satisfiers:
      - (*./batch.Job).Finish
      - (*./batch.Job).Cancel
    deferred-closure: any-path

  - id: batch-every
    trigger: ./batch.Start
    satisfiers:
      - (*./batch.Job).Finish
      - (*./batch.Job).Cancel
    deferred-closure: every-path

  - id: batch-none
    trigger: ./batch.Start
    satisfiers:
      - (*./batch.Job).Finish
      - (*./batch.Job).Cancel
    deferred-closure: none

  - id: batch-strict-every
    trigger: ./batch.Start
    satisfiers:
      - (*./batch.Job).Finish
      - (*./batch.Job).Cancel
    deferred-closure: every-path
    require-defer: true

  - id: batch-strict-none
    trigger: ./batch.Start
    satisfiers:
      - (*./batch.Job).Finish
      - (*./batch.Job).Cancel
    deferred-closure: none
    require-defer: true

  - id: fd
    trigger:
      name: ./fdio.Open
      slot: result 0
    satisfiers:
      - ./fdio.Close
    transfer: {return: true, store: false, argument: false}

  - id: pin
    trigger: ./pin.Pin
    satisfiers:
      - ./pin.Unpin

  - id: scope
    trigger:
      name: ./scope.Enter
      slot: result 0
    satisfiers:
      - name: ./scope.Leave
        slot: argument 0

  - id: handle
    trigger: ./generic.Open
    satisfiers:
      - ./generic.Close

  - id: box
    trigger: ./generic.NewBox
    satisfiers:
      - (*./generic.Box).Close

  - id: cache
    trigger: ./generic.NewCache
    satisfiers:
      - (*./generic.Cache[K, V]).Close

  - id: hold
    trigger:
      name: ./generic.Hold
      slot: argument 0
    satisfiers:
      - name: ./generic.Free
        slot: argument 0

  - id: pair
    trigger: ./pair.Both
    satisfiers:
      - ./release.Left

  - id: all
    trigger:
      name: ./generic.HoldAll
      slot: argument 0
    satisfiers:
      - name: ./generic.FreeAll
        slot: argument 0

  - id: entries
    trigger:
      name: ./generic.Lock
      slot: argument 0
    satisfiers:
      - name: ./generic.Unlock
        slot: argument 0

  - id: serve
    trigger: (*./server.Server).Serve
    satisfiers:
      - (*./server.Server).Shutdown

  - id: serve-idempotent
    trigger: (*./server.Server).Serve
    satisfiers:
      - (*./server.Server).Shutdown
    idempotent: true

  - id: write-first
    trigger: (*sync.RWMutex).Lock
    satisfiers:
      - (*sync.RWMutex).Unlock
    defer-first: true

  - id: permit
    trigger: (*./sem.Semaphore).Acquire
    satisfiers:
      - call

  - id: ledger
    trigger: (./ledger.Provider).New
    satisfiers:
      - (./ledger.Transaction).Commit
      - (./ledger.Transaction).Rollback
    transfer: none
    require-defer: true
    defer-first: true
    on-success: true
