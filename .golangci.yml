# Two sets of linters, answering two different questions.
#
#   revive, forbidigo,    is this written the way this project writes?
#   varnamelen
#   govet, errcheck,      is this wrong?
#   staticcheck,
#   ineffassign, unused
#
# They are kept together because the file has to be one file, not because the
# questions are the same. The style set is the one that fails loudest on code
# written before a rule existed; if the gate ever needs to be green before that
# debt is paid, drop the rule from `enable` rather than loosening it.
#
# forbidigo does not inspect a *declaration*: it only ever sees usage
# sites, which is an explicit choice by its maintainer as of v1.6.0
# (changelog: "Don't check names in declarations"), not a bug. So a
# forbidden abbreviation is caught where it is called and missed where it is
# introduced: a struct field carrying one is reported at every read of it and
# never at the line that declares it.
#
# Every exclusion below names the reason it exists. An exclusion without a
# reason is indistinguishable from the rule never having been enabled.
version: "2"

linters:
  default: none
  enable:
    - forbidigo
    - revive
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - varnamelen

  settings:
    revive:
      severity: error
      rules:
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: redefines-builtin-id
        - name: datarace
        - name: forbidden-call-in-wg-go
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-conditions
        - name: import-shadowing
        - name: optimize-operands-order
        - name: redundant-import-alias
          severity: warning
        - name: function-length
          # A table-driven test grows past 50 lines in its table, not in its
          # logic, and splitting one to fit the rule hides what the cases
          # cover. Same reasoning the cyclomatic rule below already applies.
          exclude:
            - TEST
          arguments:
            - 0
            - 50
        - name: receiver-naming
          # max-length is the only knob this rule exposes -- it has no
          # case-sensitivity option, so "a receiver carries no uppercase
          # letter" is not expressible here and is not checked anywhere.
          arguments:
            - max-length: 1
        - name: cyclomatic
          exclude:
            - TEST
          arguments:
            - 10
        - name: max-control-nesting
          exclude:
            - TEST
          arguments:
            - 3
        - name: defer
          arguments:
            - - loop
              - recover
              - immediate-recover
        - name: early-return
          arguments:
            - preserve-scope
            - allow-jump

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: "(?i)^mu$"
          msg: "mu is forbidden in identifiers"
        - pattern: "(?i)^cfgs?$"
          msg: "cfg and cfgs are forbidden in identifiers"
        - pattern: "(?i)^sess$"
          msg: "sess is forbidden in identifiers"
        - pattern: "(?i)^args?$"
          msg: "args and arg are forbidden in identifiers"
        - pattern: "(?i)^props?$"
          msg: "props and prop are forbidden in identifiers"
        - pattern: "(?i)^repos?$"
          msg: "repos and repo are forbidden in identifiers"
        - pattern: "(?i)^creds?$"
          msg: "creds and cred are forbidden in identifiers"
        - pattern: "(?i)^svcs?$"
          msg: "svc and svcs are forbidden in identifiers"
        - pattern: "(?i)^cols?$"
          msg: "col and cols are forbidden in identifiers"
        - pattern: "(?i)^encs?$"
          msg: "enc and encs are forbidden in identifiers"
        - pattern: "(?i)^decs?$"
          msg: "dec and decs are forbidden in identifiers"
        - pattern: "(?i)^dbs?$"
          msg: "db and dbs are forbidden in identifiers"
        - pattern: "(?i)^fs$"
          msg: "fs is forbidden in identifiers"
        - pattern: "(?i)^toks?$"
          msg: "tok and toks are forbidden in identifiers"
        - pattern: "(?i)^sas?$"
          msg: "sa and sas are forbidden in identifiers"
        - pattern: "(?i)^params?$"
          msg: "param and params are forbidden in identifiers"

    varnamelen:
      min-name-length: 2
      # 1 and not 0, which read as varnamelen's own default of 5 lines --
      # measured with a planted package: a one-letter variable used five lines
      # after its declaration passed under 0 and is reported under 1. 1 is the
      # strictest distance the setting holds.
      max-distance: 1
      # Receivers and type parameters follow Go's convention, one letter
      # (naming.md), and the minimum above would refuse every one. revive's
      # receiver-naming holds a receiver to one character; nothing checks that
      # a type parameter is one capital letter.
      check-receiver: false
      # A named result is a variable like any other. It never asked for a
      # closure around a deferred call: that comes from errcheck, and the
      # exclusion by the shape of a `defer` line below is what answers it.
      check-return: true
      check-type-param: false

  exclusions:
    generated: lax
    # Naming these explicitly is required: defining this block at all turns OFF
    # the defaults golangci-lint would otherwise apply, and the findings that
    # come back are the noise those presets exist to remove.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # A deferred call is the last thing a function does, and there is
      # nowhere left to return its error to. Naming each function that may
      # appear there is a list that grows forever and is wrong the moment
      # somebody forgets to add to it, so the exclusion is by the shape of
      # the line: errcheck still reports the same call written without
      # `defer`.
      #
      # Blind spot this accepts: a deferred Close on a WRITE path can lose
      # buffered data, and that error is worth handling. It has to be
      # noticed by a reader, because the linter no longer will.
      - linters:
          - errcheck
        source: "^\\s*defer "

issues:
  # Report everything. The defaults cap output at 50 per linter and 3 per
  # repeated message, which turns "the gate is green" into "the gate got tired"
  # and understates the real count by an order of magnitude.
  max-issues-per-linter: 0
  max-same-issues: 0
  # Third cap, same family, and the one that hid the most: the default keeps a
  # single issue per line. `cyclomatic` and `function-length` both report at the
  # function's declaration line, so a function that is too complex AND too long
  # surfaced as one finding, and which of the two won could vary between runs,
  # so a fix in an unrelated file could move findings from one rule to the
  # other. With it off, every finding is counted.
  uniq-by-line: false

# Formatting is part of the gate, decided by the developer: gofmt, the standard
# library's own formatter, and golines, which breaks a line past 100 columns. A
# file either would rewrite is reported like any other finding, and
# `golangci-lint fmt` fixes it.
#
# golines settings, each the developer's: 100 columns is the ruler the code is
# read by, and a tab counts as the two columns the editor shows. reformat-tags
# is off: it aligns the keys inside struct tags, which is not breaking a line,
# and gofmt already aligns where a tag starts. Nothing else in golines chooses
# what it breaks: a signature, a call, a composite literal, a condition joined
# by && or ||, a chain of calls.
formatters:
  enable:
    - gofmt
    - golines
  settings:
    golines:
      max-len: 100
      tab-len: 2
      reformat-tags: false

# One line per finding. Without this, revive's function-length rule prints the
# entire body of every function it flags — a 300-line function becomes 300 lines
# of output, and the log stops being navigable. The finding already carries
# file:line:column; whoever wants the context opens the file.
output:
  formats:
    text:
      path: stdout
      print-issued-lines: false
