# paircheck in a golangci-lint configuration, with every optional key of a rule
# written at its default. `slot` is left out: by default it is deduced from the
# types, as the README describes under Rules, where every key is.
#
#   golangci-lint-precept run -c golangci.example.yml ./...
#   paircheck -c golangci.example.yml ./...
version: "2"
linters:
  enable:
    - paircheck
  settings:
    custom:
      paircheck:
        type: module
        description: Reports an obligation not discharged on every path.
        settings:
          rules:
            - id: transaction
              trigger: (*database/sql.DB).Begin
              satisfiers:
                - (*database/sql.Tx).Commit
                - (*database/sql.Tx).Rollback
              open-on-error: false
              deferred-closure: any-path
              transfer: all
              require-defer: false
              idempotent: false
              defer-first: false

            - id: file
              trigger: os.Open
              satisfiers:
                - (*os.File).Close
              open-on-error: false
              deferred-closure: any-path
              transfer: all
              require-defer: false
              idempotent: false
              defer-first: false

            - id: lock
              trigger: (*sync.Mutex).Lock
              satisfiers:
                - (*sync.Mutex).Unlock
              open-on-error: false
              deferred-closure: any-path
              transfer: all
              require-defer: false
              idempotent: false
              defer-first: false
